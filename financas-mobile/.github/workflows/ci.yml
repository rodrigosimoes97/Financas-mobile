name: CI
on: [push, pull_request]
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=SUPABASE_URL=dummy --dart-define=SUPABASE_ANON_KEY=dummy
      - run: flutter build ios --no-codesign --dart-define=SUPABASE_URL=dummy --dart-define=SUPABASE_ANON_KEY=dummy
